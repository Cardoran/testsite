<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Grid Dashboard</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Public Power Generation</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>
    <main class="dashboard">

        <!-- Controls & Results -->
        <section class="card">
            <div class="card-header">
                <h2>Control Panel</h2>
            </div>

            <div class="controls-wrapper">
                
                <div class="filters">
                    <div class="input-group">
                        <label for="start">Start Date</label>
                        <input type="text" id="start" name="start" placeholder="Select start date">
                    </div>

                    <div class="input-group">
                        <label for="end">End Date</label>
                        <input type="text" id="end" name="end" placeholder="Select end date">
                    </div>

                    <button id="updateRangeButton">
                        Update Range
                    </button>
                </div>

                <div class="results-container">
                    <div class="result-box regenerative tooltip">
                        <i class="fas fa-leaf"></i>
                        <span id="regenerativePercentage">--</span>
                        <span class="tooltiptext">
                            Regenerative power percentage
                        </span>
                    </div>

                    <div class="result-box co2 tooltip">
                        <span class="co2-logo">CO₂</span>
                        <span id="co2Emissions">--</span>
                        <span class="tooltiptext">
                        CO₂ emissions
                        </span>
                    </div>
                </div>

            </div>
        </section>

        <!-- Charts -->
        <section class="card">
            <div class="card-header">
                <h2>Energy Mix Over Time</h2>
            </div>

            <div class="charts-grid-single">
                <div class="chart-box">
                    <canvas id="graphChart"></canvas>
                </div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <h2>Analysis of Current Energy Mix</h2>
            </div>

            <div class="charts-grid-single">
                <div class="chart-box">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <!-- Include Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="date_selecter_adjustment.js"></script>
    <script src="power_data_fetching.js"></script>
</body>
</html>
